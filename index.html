<style id="nf-simple-ui-styles">

/* Live Airspace visual system */
/* Simple Clean Dashboard Styling */
.simple-dashboard {
  max-width: 1100px;
  margin: 24px auto 40px;
  padding: 0 20px;
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 24px;
}
.dash-col {
  background: rgba(11, 20, 30, 0.7);
  border: 1px solid rgba(56, 189, 248, 0.2);
  border-radius: 12px;
  padding: 22px 24px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
}
.dash-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.dash-head h2 {
  font-size: 16px;
  font-weight: 700;
  color: #38bdf8;
  letter-spacing: 0.08em;
  margin: 0;
}
.dash-date {
  font-size: 11px;
  color: #94a3b8;
  font-family: monospace;
}
.advice-tag {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  margin-bottom: 6px;
}
.advice.good .advice-tag { color: #34d399; }
.advice.bad .advice-tag { color: #fbbf24; }
.advice.next .advice-tag { color: #38bdf8; }
.advice {
  padding: 14px 18px !important;
  margin-bottom: 12px !important;
  border-radius: 8px !important;
  background: rgba(15, 23, 42, 0.6) !important;
  border: 1px solid rgba(255, 255, 255, 0.08) !important;
}
.advice.good { border-left: 4px solid #34d399 !important; }
.advice.bad { border-left: 4px solid #fbbf24 !important; }
.advice.next { border-left: 4px solid #38bdf8 !important; }
.advice p {
  font-size: 13px !important;
  line-height: 1.7 !important;
  margin: 0 !important;
  color: #e2e8f0 !important;
}
.csv-register .dropzone {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 32px 20px;
  background: rgba(15, 23, 42, 0.7);
  border: 2px dashed rgba(56, 189, 248, 0.4);
  border-radius: 10px;
  min-height: 240px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.csv-register .dropzone:hover, .csv-register .dropzone.dragging {
  border-color: #38bdf8;
  background: rgba(56, 189, 248, 0.08);
  box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
}
.csv-register .drop-icon {
  font-size: 38px;
  color: #38bdf8;
  margin-bottom: 10px;
}
.csv-register .dropzone h2 {
  font-size: 16px;
  color: #ffffff;
  margin: 4px 0 8px;
}
.csv-register .dropzone p {
  font-size: 12px;
  color: #94a3b8;
  line-height: 1.6;
  margin: 0 0 16px;
}
.csv-register .small-btn {
  background: #38bdf8;
  color: #041321;
  font-weight: 700;
  font-size: 12px;
  padding: 10px 22px;
  border-radius: 6px;
  border: none;
  box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
  cursor: pointer;
}
.csv-register .small-btn:hover {
  background: #7dd3fc;
}

/* Hide clutter */
.mfd, .mfd.right, .telemetry, .trend-panel, .more-metrics,
.view-tools, .pause-btn, .scene-coordinate, .stick, .console-ridge, .console-floor,
.stage-scroll, .page-foot, .team-privacy, .advice-source, .link-button, .commandbar, .input-deck {
  display: none !important;
}

/* Clean Top Viewport */
.viewport {
  height: 440px !important;
  min-height: 380px !important;
}
.hud {
  top: 20px !important;
  left: 50% !important;
  transform: translateX(-50%) !important;
  width: auto !important;
  min-width: 300px !important;
  padding: 14px 28px !important;
  background: rgba(6, 18, 30, 0.72) !important;
  border: 1px solid rgba(56, 189, 248, 0.35) !important;
  border-radius: 12px !important;
  backdrop-filter: blur(10px) !important;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6) !important;
  text-align: center !important;
}
.hud h1 {
  font-size: 32px !important;
  font-weight: 700 !important;
  color: #ffffff !important;
  text-shadow: 0 0 15px rgba(56, 189, 248, 0.8) !important;
  margin: 2px 0 4px !important;
  padding: 0 !important;
  border: none !important;
  background: none !important;
}
.hud-pilot {
  font-size: 11px !important;
  color: #94a3b8 !important;
  margin: 0 !important;
}
.hud-stage-num {
  font-size: 12px !important;
  color: #38bdf8 !important;
  font-weight: 600 !important;
  margin: 2px 0 8px !important;
}
.personal-score {
  position: static !important;
  margin-top: 6px !important;
  padding-top: 6px !important;
  border-top: 1px solid rgba(255, 255, 255, 0.12) !important;
}
.personal-score small {
  font-size: 11px !important;
  color: #94a3b8 !important;
}
.personal-score strong {
  font-size: 34px !important;
  color: #fde047 !important;
  text-shadow: 0 0 14px rgba(253, 224, 71, 0.5) !important;
  margin: 2px 0 !important;
  display: block;
}

@media (max-width: 820px) {
  .simple-dashboard {
    grid-template-columns: 1fr;
    gap: 16px;
    padding: 0 12px;
  }
  .viewport {
    height: 360px !important;
  }
}

function runAiInspection() {
  const text = $('#review-post-text')?.value || '';
  const humanNote = $('#review-human-note')?.value || '';
  if (!text.trim()) {
    toast('対象の投稿テキストを入力してください。');
    return;
  }

  // Local keyword instrumentation only; it does not establish legality, truthfulness, or safety.
  const pharmaKeywords = ['治療', '治る', '治癒', '予防', '改善する', '完治', '半永久', '癌', 'リウマチ', 'うつ病'];
  const confidentialKeywords = ['売上', '仕入', '粗利', '原価', 'トラブル', 'クレーム', '社外秘', '未公開'];
  const moralKeywords = ['クソ', '死ね', 'ゴミ', 'バカ', '詐欺', 'リライブ批判', '競合批判'];

  const foundPharma = pharmaKeywords.filter(w => text.includes(w));
  const foundConf = confidentialKeywords.filter(w => text.includes(w));
  const foundMoral = moralKeywords.filter(w => text.includes(w));

  const pharmaRisk = foundPharma.length > 0;
  const infoRisk = foundConf.length > 0;
  const moralRisk = foundMoral.length > 0;

  let grade = 'A（登録語ヒットなし／文脈未確認）';
  let level = 'safe';
  if (pharmaRisk || moralRisk) {
    grade = 'C（注意語あり／要文脈確認）';
    level = 'danger';
  } else if (infoRisk) {
    grade = 'B（管理語あり／要確認）';
    level = 'warning';
  }

  const p = selected();
  const res = {
    grade,
    level,
    pharmaRisk,
    pharmaMsg: pharmaRisk ? `【警告】薬機法上の注意語「${foundPharma.join('、')}」が含まれています。効果効能の断定を避け、着用感や日常のセルフケア表現に言い換えてください。` : '登録済み注意語は検出されませんでした。文脈・法的適合性は未確認です。',
    infoRisk,

  text-align:center;
  pointer-events:none;
  opacity:.82;
  transition:opacity .4s ease;
}
.v22-delta-whisper::before{
  content:"";
  display:block;
  width:34px;
  height:1px;
  margin:0 auto 7px;
  background:linear-gradient(90deg,transparent,rgba(255,216,130,.42),transparent);
}
.v22-delta-whisper span{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:rgba(239,222,186,.70);
  font-size:10px;
  letter-spacing:.04em;
  text-shadow:0 2px 14px #000;
}
.v22-delta-whisper[data-kind="relation"] span,
.v22-delta-whisper[data-kind="stabilized"] span{color:rgba(255,232,177,.88)}
.v22-delta-whisper[data-kind="route"] span{color:rgba(206,239,224,.82)}
.v22-delta-whisper[data-kind="quiet"]{opacity:.50}

/* Trait identity should be felt in motion and influence, not read as a six-axis chart. */
.dominant-conversation .v17-halo{animation:v22Resonance 6.4s ease-in-out infinite;transform-origin:300px 260px}
.dominant-relationship .v17-bond-lines{stroke-dasharray:7 12;animation:v22BondFlow 9s linear infinite}
.dominant-sharing .v17-tail-assembly{filter:drop-shadow(0 18px 18px rgba(255,111,47,.18));animation:v22TailBreath 5.8s ease-in-out infinite;transform-origin:300px 340px}
.dominant-exploration .v17-crest{animation:v22CrestSeek 7.2s ease-in-out infinite;transform-origin:300px 118px}
.dominant-thought .v17-core-group{animation:v22CoreSteady 4.8s ease-in-out infinite;transform-origin:300px 263px}
.dominant-daily .v17-body-assembly{filter:drop-shadow(0 0 8px rgba(255,206,122,.16));animation:v22WarmBreath 7.6s ease-in-out infinite;transform-origin:300px 260px}

@keyframes v22Resonance{0%,100%{opacity:.58;transform:scale(.992)}50%{opacity:.90;transform:scale(1.018)}}
@keyframes v22BondFlow{to{stroke-dashoffset:-38}}
@keyframes v22TailBreath{0%,100%{opacity:.88}50%{opacity:1}}
@keyframes v22CrestSeek{0%,100%{transform:rotate(-.4deg)}45%{transform:rotate(1.4deg)}70%{transform:rotate(.2deg)}}
@keyframes v22CoreSteady{0%,100%{opacity:.78;transform:scale(.98)}50%{opacity:1;transform:scale(1.035)}}
@keyframes v22WarmBreath{0%,100%{opacity:.95}50%{opacity:1}}

/* Difference is a whisper, not a notification card. */
.v16-world[data-v22-delta="stabilized"] .v17-phoenix-svg,
.v16-world[data-v22-delta="relation"] .v17-phoenix-svg{
  filter:drop-shadow(0 0 10px rgba(255,210,125,.14));
}
.v16-world[data-v22-topology="conversation"] .v14-ring.r1{opacity:.72}
.v16-world[data-v22-topology="relationship"] .v14-trail-memory{opacity:.54}
.v16-world[data-v22-topology="sharing"] .v14-trail-memory{transform:scaleX(1.12);transform-origin:center}
.v16-world[data-v22-topology="exploration"] .v15-frontier-fog{opacity:.56}
.v16-world[data-v22-topology="thought"] .v14-core{filter:drop-shadow(0 0 14px rgba(255,220,139,.22))}
.v16-world[data-v22-topology="daily"] .v14-mist{opacity:.40}

@media(max-width:767px){
  .v16-next-caption{bottom:74px!important}
  .v22-delta-whisper{
    bottom:55px;
    width:calc(100% - 112px - var(--nf-safe-left) - var(--nf-safe-right));
  }
  .v22-delta-whisper span{font-size:11px;line-height:1.35}
  .v22-delta-whisper::before{margin-bottom:5px;width:28px}
}
@media(max-width:479px){
  .v22-delta-whisper{width:calc(100% - 102px - var(--nf-safe-left) - var(--nf-safe-right))}
  .v22-delta-whisper span{font-size:10px}
}
@media(orientation:landscape) and (max-height:520px){
  .v16-next-caption{right:74px!important;left:auto!important;bottom:9px!important;transform:none!important;width:34%!important;text-align:right!important}
  .v22-delta-whisper{left:50%;bottom:9px;width:30%;transform:translateX(-50%)}
  .v22-delta-whisper span{font-size:10px}
}
@media(prefers-reduced-motion:reduce){
  .dominant-conversation .v17-halo,
  .dominant-relationship .v17-bond-lines,
  .dominant-sharing .v17-tail-assembly,
  .dominant-exploration .v17-crest,
  .dominant-thought .v17-core-group,
  .dominant-daily .v17-body-assembly{animation:none!important}
}

<script id="nf-v22-living-sky-engine">
(function(){
'use strict';

function dayBefore(date){
  try{return L.dayAdd(date,-1);}catch(_){return date;}
}
function routeRank(status){
  return status==='current'||status==='past'?2:status==='open'?1:0;
}
function livingSkyDelta(pid,date){
  const prev=dayBefore(date);
  let nowMemory,prevMemory,nowRelations,prevRelations,nowRoute,prevRoute,nowWaypoint,prevWaypoint;
  try{
    nowMemory=flightMemory(pid,date); prevMemory=flightMemory(pid,prev);
    nowRelations=relationshipMap(pid,date); prevRelations=relationshipMap(pid,prev);
    nowRoute=routeRadar(pid,date); prevRoute=routeRadar(pid,prev);
    nowWaypoint=nextWaypoint(pid,date); prevWaypoint=nextWaypoint(pid,prev);
  }catch(_){
    return {kind:'quiet',summary:'空は静かに続いています',count:0};
  }
  const prevStars=new Map((prevRelations.stars||[]).map(s=>[s.id,s]));
  const newStars=[],rekindled=[],stabilized=[];
  for(const s of (nowRelations.stars||[])){
    const p=prevStars.get(s.id);
    if(!p && s.first===date)newStars.push(s);
    else if(p && s.last===date && s.encounters>p.encounters)rekindled.push(s);
    if(s.fixed && (!p || !p.fixed) && s.last===date)stabilized.push(s);
  }
  const today=(nowMemory.events||[]).filter(e=>e.date===date);
  const countType=type=>today.filter(e=>e.type===type).reduce((n,e)=>n+(Number(e.quantity)||1),0);
  let routeProgress=0;
  for(let i=0;i<Math.max(nowRoute.length,prevRoute.length);i++){
    if(routeRank(nowRoute[i]?.[1])>routeRank(prevRoute[i]?.[1]))routeProgress++;
  }
  const nextChanged=nowWaypoint?.target && prevWaypoint?.target && nowWaypoint.target!==prevWaypoint.target;

  if(stabilized.length) return {kind:'stabilized',summary:'ひとつの光が、消えない関係になりました',count:stabilized.length};
  if(rekindled.length) return {kind:'relation',summary:'以前出会った光が、もう一度戻ってきました',count:rekindled.length};
  if(newStars.length) return {kind:'relation',summary:'昨夜、新しい光が空に残りました',count:newStars.length};
  if(countType('unique')||countType('repeat')||routeProgress||nextChanged) return {kind:'route',summary:'航跡のひとつが、道として残り始めています',count:countType('unique')+countType('repeat')+routeProgress};
  if(countType('third')) return {kind:'resonance',summary:'ひとつの会話が、複数の光へ広がりました',count:countType('third')};
  if(countType('return')) return {kind:'return',summary:'返ってきた光に、自分の光がもう一度重なりました',count:countType('return')};
  if(countType('reply')) return {kind:'reply',summary:'遠くから光が返ってきました',count:countType('reply')};
  if(countType('share')) return {kind:'share',summary:'航跡が、いつもより遠くまで伸びています',count:countType('share')};
  if(countType('post')) return {kind:'post',summary:'今日の飛行が、新しい航跡を残しました',count:countType('post')};
  return {kind:'quiet',summary:'空は静かに続いています',count:0};
}
function livingSkyTemporal(pid,date){
  let memory;
  try{memory=flightMemory(pid,date);}catch(_){return {fire:0,afterglow:0,trail:0,terrain:0};}
  const out={fire:0,afterglow:0,trail:0,terrain:0};
  for(const e of (memory.events||[])){
    const age=Number(e.age)||0;
    if(age<=1)out.fire++;
    else if(age<=7)out.afterglow++;
    else if(age<=30)out.trail++;
    else if(['relation','repeat','unique'].includes(e.type))out.terrain++;
  }
  return out;
}
function livingSkyUnknown(pid,date){
  let profile,route,memory;
  try{profile=visualProfile(pid,date);route=routeRadar(pid,date);memory=flightMemory(pid,date);}catch(_){return {kind:'unconfirmed',count:1};}
  const unknownRoute=(route||[]).filter(([,s])=>s==='unknown').length;
  const unknownTraits=Object.values(profile?.traits||{}).filter(v=>!Number.isFinite(v)).length;
  const current=(memory?.events||[]).filter(e=>e.date===date).length;
  const count=unknownRoute+unknownTraits;
  if(count>0)return {kind:'unconfirmed',count};
  if(current===0)return {kind:'quiet',count:0};
  return {kind:'clear',count:0};
}
function livingSkyTopology(scene){
  const p=scene?.profile||{};
  const t=p.traits||{};
  const finite=Object.entries(t).filter(([,v])=>Number.isFinite(v)).sort((a,b)=>b[1]-a[1]);
  return {dominant:p.dominant||finite[0]?.[0]||'unlearned',secondary:finite[1]?.[0]||null};
}

window.NineFlightLivingSky={delta:livingSkyDelta,temporal:livingSkyTemporal,unknown:livingSkyUnknown};

const rt=window.NineFlightRuntime;
if(rt && typeof rt.getSceneAt==='function' && !rt.__v22Wrapped){
  const base=rt.getSceneAt.bind(rt);
  rt.getSceneAt=function(offsetDays=0){
    const scene=base(offsetDays);
    scene.delta=livingSkyDelta(scene.pid,scene.date);
    scene.temporal=livingSkyTemporal(scene.pid,scene.date);
    scene.unknown=livingSkyUnknown(scene.pid,scene.date);
    scene.topology=livingSkyTopology(scene);
    return scene;
  };
  rt.getScene=function(){return this.getSceneAt(window.NineFlightHistoryOffset||0);};
  rt.getCurrentScene=function(){return this.getSceneAt(0);};
  rt.__v22Wrapped=true;
}

function decorate(){
  const world=document.querySelector('.v16-world');
  const viewport=document.querySelector('.v16-viewport');
  if(!world||!viewport||!window.NineFlightRuntime)return;
  let scene=null;try{scene=window.NineFlightRuntime.getScene();}catch(_){return;}
  const delta=scene?.delta||{kind:'quiet',summary:'空は静かに続いています'};
  world.dataset.v22Delta=delta.kind||'quiet';
  world.dataset.v22Topology=scene?.topology?.dominant||scene?.profile?.dominant||'unlearned';
  world.dataset.v22Unknown=scene?.unknown?.kind||'clear';
  let whisper=viewport.querySelector('.v22-delta-whisper');
  if(!whisper){
    whisper=document.createElement('div');
    whisper.className='v22-delta-whisper';
    whisper.setAttribute('aria-label','昨日からの空の変化');
    whisper.innerHTML='<span></span>';
    const controls=viewport.querySelector('.v16-controls');
    viewport.insertBefore(whisper,controls||null);
  }
  whisper.dataset.kind=delta.kind||'quiet';
  const line=whisper.querySelector('span');const summary=delta.summary||'空は静かに続いています';if(line&&line.textContent!==summary)line.textContent=summary;
  const nextSmall=viewport.querySelector('.v16-next-caption small');
  if(nextSmall&&nextSmall.textContent!=='NEXT')nextSmall.textContent='NEXT';
}

const engine=window.NineFlightAirspace;
if(engine){
  const proto=Object.getPrototypeOf(engine);
  if(proto && !proto.__v22LivingSky){
    const baseRebuild=proto.rebuild;
    proto.rebuild=function(scene){
      baseRebuild.call(this,scene);
      const mode=scene?.topology?.dominant||scene?.profile?.dominant||'unlearned';
      const nodes=this.field.nodes||[],beacons=this.field.beacons||[],rays=this.field.rays||[],stars=this.field.relationships||[];
      if(mode==='conversation'){
        nodes.forEach((n,i)=>{n.rad*=.68+(i%3)*.05;});
      }else if(mode==='relationship'){
        stars.forEach((s,i)=>{const a=(i/Math.max(1,stars.length))*Math.PI*2;s.x=.5+Math.cos(a)*(.22+(i%3)*.025);s.y=.48+Math.sin(a)*(.22+(i%2)*.02);});
      }else if(mode==='sharing'){
        rays.forEach(r=>{r.len*=1.55;});
      }else if(mode==='exploration'){
        beacons.forEach((b,i)=>{b.x=i%2?.08+(.18*b.x):.92-(.18*b.x);b.y=.10+b.y*.52;});
      }else if(mode==='thought'){
        nodes.forEach((n,i)=>{n.rad*=.82;n.a=(n.a*.35)+((i%2?1:-1)*.12);});
      }else if(mode==='daily'){
        nodes.forEach((n,i)=>{n.rad*=.56+(i%4)*.045;});
      }
    };

    const baseMemory=proto.drawMemory;
    proto.drawMemory=function(ctx,scene,w,h,px,py,staticFrame){
      const terrain=(this.field.memory||[]).filter(e=>e.age>=30&&['relation','repeat','unique'].includes(e.type));
      if(terrain.length){
        ctx.save();ctx.lineCap='round';
        for(const e of terrain.slice(-18)){
          const x=e.x*w+px*.08,y=e.y*h+py*.08;
          const ageFade=Math.max(.06,Math.min(.22,.23-(e.age/500)));
          ctx.globalAlpha=ageFade;
          if(e.type==='relation'){
            const g=ctx.createRadialGradient(x,y,0,x,y,34);
            g.addColorStop(0,'rgba(255,222,151,.20)');g.addColorStop(1,'rgba(255,222,151,0)');
            ctx.fillStyle=g;ctx.fillRect(x-36,y-36,72,72);
          }else{
            const span=(e.span||.28)*w;
            ctx.strokeStyle=e.type==='unique'?'rgba(231,239,207,.62)':'rgba(136,213,202,.46)';
            ctx.lineWidth=e.type==='unique'?5.5:3.2;
            ctx.beginPath();ctx.moveTo(w*.5-span*.44,h*.80);ctx.quadraticCurveTo(x,y,w*.5+span*.44,h*.28);ctx.stroke();
          }
        }
        ctx.restore();
      }
      baseMemory.call(this,ctx,scene,w,h,px,py,staticFrame);
      const fresh=(this.field.memory||[]).filter(e=>e.age<=7);
      if(fresh.length){
        ctx.save();
        for(const e of fresh.slice(-26)){
          const x=(e.x??.5)*w+px*.16,y=(e.y??.55)*h+py*.16;
          const pulse=staticFrame?1:(.78+.22*Math.sin(this.time*1.7+(e.phase||0)));
          const r=e.age<=1?18:10;
          const g=ctx.createRadialGradient(x,y,0,x,y,r);
          g.addColorStop(0,`rgba(255,209,120,${(e.age<=1?.16:.07)*pulse})`);
          g.addColorStop(1,'rgba(255,209,120,0)');
          ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);
        }
        ctx.restore();
      }
    };

    proto.drawRelationshipStars=function(ctx,scene,w,h,px,py,staticFrame){
      const stars=this.field.relationships||[];if(!stars.length)return;
      const cx=w*.5+px,cy=h*.55+py;ctx.save();ctx.textBaseline='middle';ctx.font='10px sans-serif';
      const screen=[];
      for(let i=0;i<stars.length;i++){
        const s=stars[i],today=s.last===scene.date;
        const pulse=staticFrame?1:(.88+.12*Math.sin(this.time*.8+s.phase));
        const alpha=Math.max(.11,Math.min(.88,s.strength*pulse));
        const x=s.x*w+px*.12,y=s.y*h+py*.10;
        const size=2.2+Math.min(3.8,Math.log2(Math.max(1,s.encounters)+1)*1.35)+(s.fixed?.7:0);
        screen.push({s,x,y,size,alpha});

        ctx.globalAlpha=alpha*.22;ctx.strokeStyle='rgba(255,218,145,.62)';ctx.lineWidth=.7;
        ctx.beginPath();ctx.moveTo(cx,cy);ctx.quadraticCurveTo((cx+x)*.5,Math.min(cy,y)-h*.035,x,y);ctx.stroke();

        if(s.fixed){
          ctx.globalAlpha=alpha*.30;ctx.strokeStyle='rgba(255,226,162,.58)';ctx.lineWidth=.7;
          ctx.beginPath();ctx.ellipse(x,y,size*3.3,size*1.8,(s.phase||0)*.25,0,Math.PI*2);ctx.stroke();
        }
        if(today&&s.encounters>=2){
          const ring=(staticFrame?1:((this.time*18+s.phase*7)%22));
          ctx.globalAlpha=alpha*(.34*(1-ring/22));ctx.strokeStyle='rgba(255,232,178,.88)';ctx.lineWidth=1;
          ctx.beginPath();ctx.arc(x,y,size+5+ring,0,Math.PI*2);ctx.stroke();
        }

        ctx.globalAlpha=alpha;ctx.fillStyle=s.encounters>=5?'rgba(255,246,207,.98)':s.fixed?'rgba(255,231,166,.96)':'rgba(255,195,109,.90)';
        ctx.beginPath();ctx.arc(x,y,size,0,Math.PI*2);ctx.fill();

        if((s.fixed||i<3)&&w>820){
          ctx.globalAlpha=alpha*.74;ctx.fillStyle='rgba(255,239,198,.84)';ctx.fillText(s.label,x+size*3,y-1);
          ctx.globalAlpha=alpha*.46;ctx.font='8px sans-serif';ctx.fillText(`${s.maturity} / ${s.encounters}接点`,x+size*3,y+11);ctx.font='10px sans-serif';
        }
      }
      const connected=screen.filter(o=>o.s.types?.includes('third')||o.s.types?.includes('share')||o.s.fixed);
      for(let i=0;i<connected.length-1;i++){
        const a=connected[i],b=connected[i+1];
        ctx.globalAlpha=.08+Math.min(.16,(a.alpha+b.alpha)*.08);ctx.strokeStyle='rgba(205,232,203,.66)';ctx.lineWidth=.65;
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo((a.x+b.x)*.5,(a.y+b.y)*.5-h*.025,b.x,b.y);ctx.stroke();
      }
      if(scene.relationships?.unidentified>0&&w>760){
        ctx.globalAlpha=.26;ctx.fillStyle='rgba(205,188,153,.70)';ctx.font='9px sans-serif';
        ctx.fillText(`未識別の確認済み接点 ${scene.relationships.unidentified}`,w*.72,h*.68);
      }
      ctx.restore();
    };

    proto.drawNextWaypoint=function(ctx,scene,w,h,px,py,staticFrame){
      const wp=scene.waypoint;if(!wp)return;
      const idx=Math.max(0,Math.min(7,wp.index||0));
      const pos=[[.50,.24],[.44,.22],[.48,.19],[.57,.18],[.63,.20],[.68,.24],[.55,.16],[.50,.13]][idx]||[.5,.2];
      const x=pos[0]*w+px*.08,y=pos[1]*h+py*.08,cx=w*.5+px,cy=h*.55+py;
      const pulse=staticFrame?1:(.82+.18*Math.sin(this.time*1.35));
      ctx.save();
      const glow=ctx.createRadialGradient(x,y,0,x,y,74);
      glow.addColorStop(0,`rgba(255,229,159,${.18*pulse})`);
      glow.addColorStop(.18,`rgba(255,199,99,${.10*pulse})`);
      glow.addColorStop(1,'rgba(255,181,72,0)');
      ctx.fillStyle=glow;ctx.fillRect(x-76,y-76,152,152);
      ctx.globalAlpha=.20+.18*pulse;ctx.strokeStyle='rgba(255,224,153,.72)';ctx.lineWidth=.7;ctx.setLineDash([2,8]);
      ctx.beginPath();ctx.moveTo(cx,cy-h*.03);ctx.quadraticCurveTo((cx+x)*.5,(cy+y)*.5-h*.08,x,y);ctx.stroke();ctx.setLineDash([]);
      ctx.globalAlpha=.54+.24*pulse;ctx.fillStyle='rgba(255,239,190,.96)';ctx.beginPath();ctx.arc(x,y,2.1,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=.18+.12*pulse;ctx.strokeStyle='rgba(255,232,174,.82)';ctx.beginPath();ctx.arc(x,y,17+5*pulse,0,Math.PI*2);ctx.stroke();
      if(w>980){
        ctx.globalAlpha=.54;ctx.fillStyle='rgba(255,235,190,.86)';ctx.font='600 9px sans-serif';ctx.fillText(`POSSIBLE ROUTE  ${wp.target}`,x+22,y+2);
      }
      ctx.restore();
    };

    const baseDraw=proto.draw;
    proto.draw=function(dt,staticFrame){
      baseDraw.call(this,dt,staticFrame);
      const scene=this.scene(),ctx=this.ctx,w=this.width,h=this.height;
      if(!ctx||!w||!h)return;
      const unknown=scene.unknown||livingSkyUnknown(scene.pid,scene.date);
      const temporal=scene.temporal||livingSkyTemporal(scene.pid,scene.date);
      ctx.save();ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
      if(unknown.kind==='unconfirmed'&&unknown.count>0){
        const drift=staticFrame?0:Math.sin(this.time*.09)*w*.025;
        for(let i=0;i<Math.min(4,Math.ceil(unknown.count/2));i++){
          const x=w*(.16+i*.22)+drift*(i%2?1:-1),y=h*(.15+(i%3)*.09);
          const r=Math.min(w,h)*(.16+i*.012);
          const g=ctx.createRadialGradient(x,y,0,x,y,r);
          g.addColorStop(0,'rgba(177,188,190,.035)');g.addColorStop(.62,'rgba(157,171,178,.026)');g.addColorStop(1,'rgba(130,145,153,0)');
          ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);
        }
      }
      if(temporal.terrain>0){
        ctx.globalAlpha=Math.min(.16,.045+temporal.terrain*.008);
        ctx.strokeStyle='rgba(213,219,190,.55)';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(w*.08,h*.83);ctx.bezierCurveTo(w*.28,h*.78,w*.72,h*.34,w*.94,h*.28);ctx.stroke();
      }
      ctx.restore();
    };
    proto.__v22LivingSky=true;
    engine.sceneKey='';
    engine.mount();
  }
}

const mo=new MutationObserver(()=>decorate());
mo.observe(document.body,{childList:true,subtree:true});
decorate();
})();
</script>
